<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e1efe8"><title>Studio Werkzaam — Grafisch ontwerp & DTP</title>
<style>
:root{--mint:#e1efe8;--red:#ad5054}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--mint);color:var(--red);font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,.frame:focus-visible{outline:3px solid #74343a;outline-offset:5px}#app{position:relative;height:100dvh;min-height:420px;overflow:hidden}.header{position:absolute;z-index:12;top:22px;left:24px;right:24px;display:flex;align-items:flex-start;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.08em}.logo{line-height:.91}.header nav{display:flex;gap:16px}.header button,.back,.next{background:transparent;border:0;font-weight:900;letter-spacing:.06em}.stage{position:absolute;inset:0}.frame{position:absolute;left:50%;top:46%;width:min(79vw,850px);height:clamp(145px,27vh,235px);transform:translate(-50%,-50%);border:clamp(9px,1.4vw,15px) solid var(--red);background:var(--mint);overflow:hidden;cursor:pointer;transition:width .8s cubic-bezier(.2,.7,.2,1),height .8s cubic-bezier(.2,.7,.2,1)}.frame.project{width:min(72vw,680px);height:min(63vh,540px)}.slide{position:absolute;inset:0;display:grid;place-items:center;will-change:transform,opacity}.slide svg{width:100%;height:100%;display:block}.intro{font-weight:900;font-size:clamp(23px,6.1vw,90px);white-space:nowrap;letter-spacing:-.065em;line-height:1}.sub{position:absolute;top:calc(46% + min(15vh,145px));width:100%;text-align:center;font-size:clamp(9px,1vw,13px);font-weight:800;letter-spacing:.2em;transition:opacity .4s}.meta{position:absolute;left:25px;right:25px;bottom:25px;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:11px;font-weight:800;letter-spacing:.07em;z-index:10}.controls{display:flex;align-items:center;gap:8px}.controls button{border:1px solid var(--red);background:transparent;width:40px;height:40px;border-radius:50%;font-size:21px}.progress{position:absolute;bottom:0;left:0;width:0;height:4px;background:var(--red);transition:width .6s}.fly{position:absolute;z-index:8;width:160px;height:146px;top:0;left:0;pointer-events:none;filter:drop-shadow(0 4px 3px #51282c30);transform-origin:50% 55%;will-change:transform}.fly img{position:absolute;object-fit:contain;display:block}.fly .left{left:4%;top:0;width:47%;height:83%;transform-origin:97% 74%}.fly .right{right:4%;top:0;width:47%;height:83%;transform-origin:3% 74%}.fly .body{left:35%;top:20%;width:30%;height:79%;z-index:2}.detail{position:absolute;inset:0;background:var(--mint);z-index:20;overflow-y:auto;padding:80px max(24px,calc((100vw - 1060px)/2)) 50px;display:none}.detail.active{display:block}.detail .back{position:fixed;top:25px;left:24px;z-index:22}.detail h1{font-size:clamp(48px,10vw,135px);line-height:.92;letter-spacing:-.075em;margin:20px 0 36px;overflow-wrap:anywhere}.detail-art{width:100%;max-height:620px;aspect-ratio:1.5;overflow:hidden;background:white}.detail-art svg{width:100%;height:100%;display:block}.detail-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:35px 0;font-size:13px;font-weight:800}.detail-foot .next{font-size:15px}.hint{font-size:10px;opacity:.85}.frame:active{opacity:.96}@media(max-width:620px){.header{top:18px;left:16px;right:16px}.header nav{gap:12px}.frame.project{width:84vw;height:51vh}.fly{width:115px;height:105px}.meta{left:16px;right:16px;bottom:20px;align-items:flex-end}.meta>span{max-width:48%;line-height:1.6}.controls button{width:38px;height:38px}.sub{top:calc(46% + 100px)}.detail{padding:80px 18px 40px}.detail h1{margin-top:38px}.detail-art{aspect-ratio:.95}}@media(prefers-reduced-motion:reduce){.frame,.progress{transition:none}}
</style></head><body>
<div id="app"><header class="header"><div class="logo">STUDIO<br>WERKZAAM</div><nav><button id="workBtn">WERK</button><button id="aboutBtn">OVER</button></nav></header>
<main class="stage" id="stage"><div id="frame" class="frame" role="button" tabindex="0" aria-label="Open project"><div id="slide" class="slide"><div class="intro">STUDIO WERKZAAM</div></div></div><div class="sub" id="sub">GRAFISCH ONTWERP EN DTP</div><div class="fly" id="fly"><img class="left" id="left" src="./linkervleugel.webp" alt=""><img class="right" id="right" src="./rechtervleugel.webp" alt=""><img class="body" src="./lichaam.webp" alt=""></div></main>
<div class="meta"><span id="counter">INTRO / 00</span><span class="hint" id="hint">SCROLL OF SWIPE OM TE ONTDEKKEN</span><div class="controls"><button id="prev" aria-label="Vorig project">←</button><button id="next" aria-label="Volgend project">→</button></div></div><div class="progress" id="progress"></div>
<section class="detail" id="detail"><button class="back" id="back">← ALLE PROJECTEN</button><h1 id="detailTitle"></h1><div class="detail-art" id="detailArt"></div><div class="detail-foot"><span>STUDIO WERKZAAM — SELECTED WORK</span><button class="next" id="detailNext">VOLGEND PROJECT →</button></div></section></div>
<script>
(()=>{
const names=['Mogelijk','28× Utrecht','Apotheek Breukelen','BeDesign','BIZ','Bourgondië','Fonds Gehandicaptensport','FrieslandCampina','GU','IT','La Scava','Maxwellness','R&V','ReMaTec','SAVE','Sherpa','TIM','U-BOSS'];
const $=id=>document.getElementById(id);let selected=0,busy=false,detailOpen=false,lastWheel=0,touchY=null,flyX=null,flyY=null,targetX=null,targetY=null,nextFlight=0;const start=performance.now();
function art(i){let n=names[i],h=(i*43+190)%360,fg=i%3===0?'#ffffff':'#142e3c',bg='hsl('+h+' 55% 55%)';let safe=n.replaceAll('&','&amp;');return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid slice"><rect width="900" height="620" fill="'+bg+'"/><circle cx="740" cy="120" r="255" fill="white" opacity=".15"/><path d="M0 460L900 160V620H0Z" fill="'+fg+'" opacity=".15"/><path d="M0 600L900 300V620H0Z" fill="white" opacity=".12"/><text x="55" y="105" font-family="Arial" font-weight="900" font-size="25" fill="'+fg+'">STUDIO WERKZAAM / '+String(i+1).padStart(2,'0')+'</text><text x="55" y="350" font-family="Arial" font-weight="900" font-size="'+(safe.length>17?55:safe.length>10?78:116)+'" fill="'+fg+'">'+safe+'</text><text x="58" y="550" font-family="Arial" font-size="25" font-weight="700" fill="'+fg+'">GRAFISCH ONTWERP &amp; DTP</text></svg>'}
function show(){let frame=$('frame'),slide=$('slide');frame.classList.toggle('project',selected>0);$('sub').style.opacity=selected===0?'1':'0';$('counter').textContent=selected?String(selected).padStart(2,'0')+' / 18 — '+names[selected-1].toUpperCase():'INTRO / 00';$('progress').style.width=(selected/18*100)+'%';slide.innerHTML=selected?art(selected-1):'<div class="intro">STUDIO WERKZAAM</div>';slide.style.transform='translateY(0) scale(1)';slide.style.opacity='1'}
function go(delta){if(busy||detailOpen)return;let target=Math.max(0,Math.min(names.length,selected+delta));if(target===selected)return;busy=true;const old=$('slide'),frame=$('frame'),out=delta>0?-1:1;old.animate([{transform:'translateY(0) scale(1)',opacity:1},{transform:'translateY('+out*110+'%) scale(.75)',opacity:0}],{duration:530,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});setTimeout(()=>{selected=target;show();const incoming=$('slide');incoming.animate([{transform:'translateY('+(-out*110)+'%) scale(.75)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],{duration:570,easing:'cubic-bezier(.2,.7,.2,1)'});setTimeout(()=>busy=false,600)},500)}
function openProject(){if(selected===0){go(1);return}detailOpen=true;$('detailTitle').textContent=names[selected-1];$('detailArt').innerHTML=art(selected-1);$('detail').classList.add('active');$('detail').scrollTop=0;history.replaceState(null,'','#project-'+selected)}
function closeProject(){detailOpen=false;$('detail').classList.remove('active');history.replaceState(null,'',location.pathname)}
$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);$('workBtn').onclick=()=>{if(detailOpen)closeProject();go(selected===0?1:0)};$('aboutBtn').onclick=()=>{if(detailOpen)closeProject();alert('Studio Werkzaam — Grafisch ontwerp en DTP.');};$('frame').onclick=openProject;$('frame').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openProject()}};$('back').onclick=closeProject;$('detailNext').onclick=()=>{selected=selected%18+1;show();openProject()};window.addEventListener('keydown',e=>{if(e.key==='Escape'&&detailOpen)closeProject();else if(!detailOpen&&e.key==='ArrowRight')go(1);else if(!detailOpen&&e.key==='ArrowLeft')go(-1)});window.addEventListener('wheel',e=>{if(detailOpen)return;e.preventDefault();let now=Date.now();if(now-lastWheel<780)return;lastWheel=now;go(e.deltaY>0?1:-1)},{passive:false});$('stage').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{if(touchY===null)return;let d=e.changedTouches[0].clientY-touchY;if(Math.abs(d)>45)go(d<0?1:-1);touchY=null},{passive:true});
function tick(t){let w=innerWidth,h=innerHeight,frame=$('frame').getBoundingClientRect();if(flyX===null){flyX=frame.right-85;flyY=frame.top-95;targetX=flyX;targetY=flyY}if(t-start>2400&&t>nextFlight){targetX=25+Math.random()*Math.max(30,w-190);targetY=50+Math.random()*Math.max(30,h-210);nextFlight=t+1900+Math.random()*1400}flyX+=(targetX-flyX)*.012;flyY+=(targetY-flyY)*.012;let angle=8+(1-Math.cos(t*.026))*33;$('left').style.transform='perspective(380px) rotateY('+angle+'deg) translateX(3px)';$('right').style.transform='perspective(380px) rotateY('+(-angle)+'deg)';$('fly').style.transform='translate('+flyX+'px,'+(flyY+Math.sin(t*.002)*7)+'px) rotate('+(t-start>2400?Math.sin(t*.0014)*10:0)+'deg)';requestAnimationFrame(tick)}
show();requestAnimationFrame(tick);
})();
</script></body></html>
