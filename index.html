<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e1efe8"><title>Studio Werkzaam — Portfolio</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#e1efe8;color:#ad5054;font-family:Arial,sans-serif}button{cursor:pointer;font:inherit}button:focus-visible,.frame:focus-visible{outline:3px solid #7b2b37;outline-offset:4px}.app{height:100dvh;min-height:480px;position:relative;overflow:hidden}.header{position:absolute;z-index:12;top:22px;left:25px;right:25px;display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.07em}.brand{line-height:1;opacity:0;transform:translateY(-9px);transition:opacity .65s ease,transform .65s ease;pointer-events:none}.brand.visible{opacity:1;transform:translateY(0)}.header nav{display:flex;gap:22px}.header button{border:0;background:none;color:inherit;font-weight:800;font-size:11px}.frame{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);border:clamp(9px,1.5vw,15px) solid #ad5054;overflow:hidden;background:#e1efe8;cursor:pointer;will-change:width,height}.layer{position:absolute;inset:0;will-change:transform}.layer svg{width:100%;height:100%;display:block}.intro{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-weight:900;white-space:nowrap;letter-spacing:.05em;pointer-events:none}.sub{position:absolute;left:0;right:0;text-align:center;letter-spacing:.15em;font-size:clamp(11px,1.5vw,18px);pointer-events:none}.fly{position:absolute;width:clamp(133px,19.6vw,252px);aspect-ratio:1490/724;z-index:8;pointer-events:none;filter:drop-shadow(3px 7px 5px #321b2338);will-change:transform;transform-style:preserve-3d}.part{position:absolute;display:block;height:auto;will-change:transform;backface-visibility:visible}.left{width:47.52%;left:1.35%;top:1.66%;transform-origin:97% 66%}.body{width:32.48%;left:31.34%;top:12.02%;z-index:3}.right{width:50.6%;left:49.4%;top:1.52%;transform-origin:3% 66%}.arrows{position:absolute;z-index:9;right:12px;top:46%;transform:translateY(-50%);display:grid;gap:8px}.arrows button{background:#e1efe8;border:1px solid #ad5054;color:#ad5054;width:36px;height:36px;font-size:19px}.footer{position:absolute;bottom:18px;left:25px;right:25px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em}.progress{position:absolute;bottom:0;left:0;height:3px;background:#ad5054}.page{display:none;position:absolute;inset:0;z-index:20;background:#e1efe8;overflow-y:auto}.page.show{display:block}.pagein{max-width:970px;margin:auto;padding:85px clamp(25px,6vw,75px) 70px}.back{border:0;background:none;color:#ad5054;font-size:11px;font-weight:900;letter-spacing:.12em;margin-bottom:40px;padding:0}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:800}.page h1{font-size:clamp(48px,9vw,100px);line-height:.95;letter-spacing:-.055em;margin:16px 0 35px;overflow-wrap:anywhere}.hero{width:100%;max-height:530px;overflow:hidden}.hero svg{display:block;width:100%;height:auto}.desc{display:grid;grid-template-columns:1fr 2fr;gap:25px;padding:30px 0;border-bottom:1px solid #ad505477}.desc span{font-size:11px;letter-spacing:.1em;font-weight:900}.desc p{margin:0;font-size:clamp(15px,2vw,20px);line-height:1.5}.next{background:none;border:0;color:#ad5054;font-weight:900;font-size:12px;letter-spacing:.08em;margin-top:30px;padding:0}@media(max-width:520px){.header{left:15px;right:15px}.header nav{gap:10px}.footer{left:15px;right:15px}.arrows{right:4px}.desc{grid-template-columns:1fr}}</style></head><body>
<div class="app" id="app"><header class="header"><div class="brand" id="smallLogo">STUDIO<br>WERKZAAM</div><nav><button id="about">ABOUT</button><button id="contact">CONTACT</button></nav></header><div class="frame" id="frame" role="button" tabindex="0" aria-label="Open het geselecteerde project"><div class="layer" id="old"></div><div class="layer" id="fresh"></div></div><div class="intro" id="intro">STUDIO WERKZAAM</div><div class="sub" id="sub">GRAFISCH ONTWERP EN DTP</div><div class="fly" id="fly"><img class="part left" id="left" src="./linkervleugel.webp" alt=""><img class="part body" src="./lichaam.webp" alt=""><img class="part right" id="right" src="./rechtervleugel.webp" alt=""></div><div class="arrows"><button id="up" aria-label="Vorig project">↑</button><button id="down" aria-label="Volgend project">↓</button></div><footer class="footer"><span id="label">INTRO / 00</span><span id="hint">SCROLL TO EXPLORE ↓</span></footer><div class="progress" id="progress"></div><section class="page" id="page"><div class="pagein"><button class="back" id="back">← ALLE PROJECTEN</button><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><div class="hero" id="hero"></div><div class="desc"><span>OVER DIT PROJECT</span><p id="description"></p></div><button class="next" id="next">VOLGEND PROJECT ↗</button></div></section></div>
<script>
(()=>{const $=id=>document.getElementById(id),root=$('app'),names=['Mogelijk','28× Utrecht','Apotheek Breukelen','BeDesign','BIZ','Bourgondië','Fonds Gehandicaptensport','FrieslandCampina','GU','IT','La Scava','Maxwellness','R&V','ReMaTec','SAVE','Sherpa','TIM','U-BOSS'],ratios=[.733,1.596,.72,1.5,1.5,1.5,.73,1.5,.75,1.5,.73,1.5,1.5,1.5,1.5,1.5,1.5,1.5];let selected=0,motion=null,page=false,flyX=0,flyY=0,tx=0,ty=0,nextFlight=0,started=performance.now(),sum=0,lastWheel=0;const ease=v=>{v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)},mix=(a,b,t)=>a+(b-a)*t;
function art(i){let n=names[i],h=(i*37+195)%360,s=n.replaceAll('&','&amp;');if(i===0)return '<svg viewBox="0 0 500 680" preserveAspectRatio="xMidYMid slice"><rect width="500" height="680" fill="#e8f5fa"/><rect width="500" height="155" fill="#18124d"/><rect x="30" y="175" width="440" height="390" rx="45" fill="#5dc1e2"/><text x="35" y="67" fill="white" font-size="24" font-weight="700">Mogelijk Zakelijke</text><text x="35" y="98" fill="white" font-size="24" font-weight="700">Hypotheken Fonds 20</text><text x="57" y="286" fill="white" font-size="48" font-weight="700">Zet uw</text><text x="57" y="343" fill="white" font-size="48" font-weight="700">vermogen</text><text x="57" y="400" fill="white" font-size="48" font-weight="700">voor u aan</text><text x="57" y="457" fill="white" font-size="48" font-weight="700">het werk</text><text x="280" y="645" fill="#18124d" font-size="36" font-weight="700">mogelijk</text></svg>';if(i===1)return '<svg viewBox="0 0 900 560" preserveAspectRatio="xMidYMid slice"><rect width="900" height="560" fill="#17488c"/><path d="M0 170L900 40V360L0 500Z" fill="#c6c9c7"/><path d="M0 260L900 130V390L0 550Z" fill="#e1e5e2"/><path d="M0 410L900 285V420L0 560Z" fill="#9aa09e"/><text x="490" y="280" font-size="90" font-weight="900" fill="#17488c">28×</text><text x="490" y="365" font-size="75" font-weight="900" fill="#17488c">UTRECHT</text></svg>';return '<svg viewBox="0 0 900 650" preserveAspectRatio="xMidYMid slice"><rect width="900" height="650" fill="hsl('+h+',48%,35%)"/><circle cx="710" cy="140" r="260" fill="white" opacity=".14"/><path d="M0 510L900 170V650H0Z" fill="hsl('+h+',42%,55%)"/><path d="M0 620L900 350V650H0Z" fill="hsl('+h+',45%,24%)"/><text x="45" y="365" fill="white" font-size="'+(n.length>17?42:n.length>11?60:82)+'" font-weight="900">'+s+'</text></svg>'}
function dims(i){let w=root.clientWidth,h=root.clientHeight;if(!i){let a=Math.min(w*.77,610);return{w:a,h:a/3.45}}let r=ratios[i-1],maxW=w-Math.min(100,w*.2),maxH=h-Math.min(165,h*.3),hh=Math.min(maxH,maxW/r);return{w:hh*r,h:hh}}
function go(i){if(page||motion)return;i=Math.max(0,Math.min(names.length,i));if(i===selected)return;motion={from:selected,to:i,dir:i>selected?1:-1,start:performance.now()};$('old').innerHTML=selected?art(selected-1):'';$('fresh').innerHTML=i?art(i-1):'';selected=i;$('hint').style.opacity='0'}
function show(i){page=true;selected=i+1;$('page').classList.add('show');$('page').scrollTop=0;$('eyebrow').textContent='PROJECT '+String(i+1).padStart(2,'0')+' / '+names.length;$('title').textContent=names[i];$('hero').innerHTML=art(i);$('description').textContent='Een selectie van het grafisch ontwerp voor '+names[i]+'. Hier komen de definitieve projectbeschrijving en aanvullende ontwerpen.';$('next').onclick=()=>show((i+1)%names.length)}
function back(){page=false;$('page').classList.remove('show');$('fresh').innerHTML=art(selected-1);$('fresh').style.transform='translateY(0) scale(1)';$('old').innerHTML='';motion=null}
$('frame').onclick=()=>{if(selected&&!motion&&!page)show(selected-1)};$('frame').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(selected&&!motion&&!page)show(selected-1)}};$('back').onclick=back;$('up').onclick=()=>go(selected-1);$('down').onclick=()=>go(selected+1);root.addEventListener('wheel',e=>{if(page)return;e.preventDefault();let t=performance.now();if(t-lastWheel>350)sum=0;lastWheel=t;sum+=e.deltaY;if(Math.abs(sum)>110){go(selected+(sum>0?1:-1));sum=0}},{passive:false});let touch=0;root.addEventListener('touchstart',e=>touch=e.touches[0].clientY,{passive:true});root.addEventListener('touchend',e=>{if(page)return;let d=touch-e.changedTouches[0].clientY;if(Math.abs(d)>40)go(selected+(d>0?1:-1))},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&page)back();else if(!page&&(e.key==='ArrowDown'||e.key==='ArrowRight'))go(selected+1);else if(!page&&(e.key==='ArrowUp'||e.key==='ArrowLeft'))go(selected-1)});$('about').onclick=()=>alert('Studio Werkzaam — grafisch ontwerp en DTP.');$('contact').onclick=()=>alert('Contactgegevens worden nog toegevoegd.');
function tick(t){let d=dims(selected),w=root.clientWidth,h=root.clientHeight;if(motion){let p=Math.min(1,(t-motion.start)/1120),a=dims(motion.from),b=dims(motion.to),k=ease(p);d={w:mix(a.w,b.w,k),h:mix(a.h,b.h,k)};let shrink=ease(p/.22),leave=ease((p-.17)/.43),arrive=ease((p-.32)/.43),fill=ease((p-.78)/.22);$('old').style.transform='translateY('+(-motion.dir*leave*145)+'%) scale('+(1-.25*shrink)+')';$('old').style.opacity=motion.from?1:0;$('fresh').style.transform='translateY('+(motion.dir*(1-arrive)*145)+'%) scale('+(.75+.25*fill)+')';$('fresh').style.opacity=motion.to?1:0;if(p>=1){motion=null;$('old').innerHTML='';$('fresh').style.transform='translateY(0) scale(1)'}}$('frame').style.width=d.w+'px';$('frame').style.height=d.h+'px';let intro=selected?1:0;if(motion&&motion.from===0)intro=ease(Math.min(1,(t-motion.start)/700));if(motion&&motion.to===0)intro=1-ease(Math.min(1,(t-motion.start)/850));$('intro').style.opacity=1-intro;$('intro').style.transform='translate(-50%,-50%) scale('+(1+intro*.48)+')';$('intro').style.fontSize=Math.min(48,Math.max(12,dims(0).w/17.5))+'px';$('smallLogo').classList.toggle('visible',intro>.9);$('sub').style.top='calc(46% + '+(dims(0).h/2+33)+'px)';$('sub').style.opacity=1-intro;$('label').textContent=selected?String(selected).padStart(2,'0')+' / '+names.length+' — '+names[selected-1].toUpperCase():'INTRO / 00';$('progress').style.width=selected/names.length*100+'%';let a=dims(0),homeX=w/2+a.w/2-110,homeY=h*.46-a.h/2-52;if(!flyX){flyX=homeX;flyY=homeY;tx=homeX;ty=homeY}let flying=t-started>2500;if(flying&&t>nextFlight){tx=20+Math.random()*Math.max(20,w-210);ty=60+Math.random()*Math.max(20,h-165);nextFlight=t+3200+Math.random()*1800}flyX+=(tx-flyX)*.009;flyY+=(ty-flyY)*.009;let beat=(1-Math.cos(t*.030))/2,angle=8+beat*66;$('left').style.transform='perspective(650px) rotateY('+(-angle)+'deg)';$('right').style.transform='perspective(650px) rotateY('+angle+'deg)';$('fly').style.transform='translate('+flyX+'px,'+(flyY+Math.sin(t*.0017)*3)+'px) rotate('+(flying?Math.sin(t*.0008)*3:0)+'deg)';requestAnimationFrame(tick)}requestAnimationFrame(tick)
})();
</script></body></html>
